# Пользователи живут только в Postgres (том postgres_data).
# Не запускай: docker compose down -v  — флаг -v удаляет том вместе с данными.
# Не меняй POSTGRES_* в .env у уже существующего тома: пароль задаётся только при первом создании.
services:
  postgres:
    image: postgres:16
    container_name: refocus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: refocus_postgres_data
