services:
  postgres:
    image: postgres:16
    container_name: refocus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: refocus_user
      POSTGRES_PASSWORD: refocus_pass
      POSTGRES_DB: refocus_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
